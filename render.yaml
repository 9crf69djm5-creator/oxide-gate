# Render Blueprint — OXIDE gate-api + Discord bot (both run in the cloud 24/7)
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec
#
# Persistence:
# 1) Prefer a Render disk mounted at /data → DB_PATH=/data/keys.db
# 2) Free tier (no disk): Render Postgres stores the SQLite file as a BYTEA blob
#    (gate-api/lib/db.js). Code auto-detects /data when present.
#
# To attach a paid disk later (dashboard or blueprint):
#   disk: { name: oxide-data, mountPath: /data, sizeGB: 1 }
# Then health should report db=/data/keys.db and dbEphemeral=false.

databases:
  - name: oxide-keys-db
    plan: free
    databaseName: oxide
    user: oxide
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: oxide-gate-api
    runtime: node
    rootDir: gate-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Prefer /data when a disk is mounted; code falls back to /tmp + Postgres blob.
      - key: DB_PATH
        value: /data/keys.db
      - key: DATABASE_URL
        fromDatabase:
          name: oxide-keys-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false
      - key: DOWNLOAD_URL
        value: https://oxide-gate-api.onrender.com/downloads/Oxide.exe
      - key: CORS_ORIGINS
        value: https://oxide-gate-site.vercel.app,http://localhost:5173,http://127.0.0.1:5173,null
      - key: DISCORD_INVITE
        value: https://discord.gg/3PXJ8r56T
      - key: DISCORD_BOT_HEALTH_URL
        value: https://oxide-discord-bot-fra.onrender.com/
      - key: DISCORD_BOT_NOTIFY_URL
        value: https://oxide-discord-bot-fra.onrender.com
      - key: ROBLOX_GAMEPASS_WEEK
        value: "1999442394"
      - key: ROBLOX_GAMEPASS_MONTH
        value: "1999370393"
      - key: ROBLOX_GAMEPASS_LIFETIME
        value: "1999478401"
      # Empty so shirt placeholders never override game passes
      - key: ROBLOX_ASSET_WEEK
        value: ""
      - key: ROBLOX_ASSET_MONTH
        value: ""
      - key: ROBLOX_COOKIE
        sync: false
      - key: DEMO_ROBLOX
        value: "0"

  # Discord bot — Frankfurt (oxide-discord-bot-fra). Binds PORT for health.
  # One-time: paste DISCORD_TOKEN, CLIENT_ID, GUILD_ID in Render Environment.
  - type: web
    name: oxide-discord-bot-fra
    runtime: node
    rootDir: discord-bot
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node --dns-result-order=ipv4first src/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: API_BASE_URL
        value: https://oxide-gate-api.onrender.com
      - key: GATE_API_HEALTH_URL
        value: https://oxide-gate-api.onrender.com/api/health
      - key: SITE_URL
        value: https://oxide-gate-site.vercel.app
      - key: DISCORD_INVITE
        value: https://discord.gg/3PXJ8r56T
      - key: ROBLOX_POLL_MINUTES
        value: "20"
      - key: AUTO_SETUP
        value: "true"
      - key: WELCOME_MESSAGE
        value: "true"
