<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OXIDE — Buy</title>
    <meta name="description" content="Buy OXIDE access." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="buy">
    <div class="gate-page">
      <canvas class="topo-canvas" data-topo aria-hidden="true"></canvas>

      <a class="brand gate-brand-link" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        OXIDE
      </a>

      <main class="gate-main">
        <div class="gate-stack">
          <h1 id="buy-title">Premium</h1>
          <div class="price-row">
            <span class="amount" id="buy-amount">15</span>
            <span class="unit" id="buy-unit">USD</span>
          </div>
          <p class="gate-blurb" id="buy-blurb">
            One payment. Access stays on your license key.
          </p>
          <a class="btn btn-accent btn-block" href="#" id="buy-cta" style="margin-top: 1.5rem"
            >Buy OXIDE</a
          >
          <p class="hint" id="buy-payment-note" style="margin-top: 1rem">
            Set SellApp checkout links in <code>js/config.js</code>. After pay,
            redeem your key on Get a key.
          </p>
        </div>

        <div class="plans" id="buy-plans" aria-label="Other plans"></div>
      </main>

      <footer class="gate-footer">
        <a id="buy-discord" href="#">Discord</a>
        <a href="key.html">Get a key</a>
        <a href="index.html">Site</a>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/topography.js"></script>
  </body>
</html>
